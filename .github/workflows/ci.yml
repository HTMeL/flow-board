name: CI

on:
  push:
    branches: [main]
  pull_request:

# cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # No secrets or database credentials here on purpose: tests mock Supabase and block
      # all network access, so they must pass without any.
      - name: Unit and regression tests
        run: npm test

      - name: Build
        run: npm run build
